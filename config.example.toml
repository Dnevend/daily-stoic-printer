# 复制为 config.toml 后按需修改（config.toml 不入库）
# 优先级：内置默认值 < config.toml < 环境变量 < 命令行参数

[defaults]
source = "daily-stoic"

[render]
width = 48        # 80mm Font A ≈ 48 列
words = 8         # 生词条数
common = 6000     # 前 N 个高频词视为"已认识"；调低＝生词更多更简单
max_words = 900   # 打印时正文最多保留多少词（0 = 不限）；长文会被截断但存档保留全文
filter_promos = true  # 过滤正文里的推广/CTA 段落（打印用；存档仍是原文）
promo_phrases = []    # 追加自定义促销短语，如 ["special offer", "limited time"]
translation = true    # 打印正文中文译文（需要联网，且打印机支持中文）
# 位图（封面/配图）需要 Pillow（`uv pip install -e ".[images]"`）。命令头必须是小写
# GS v 0（1D 76 30 00）；误写成大写 GS V 会让打印机先切一刀、再把位图当文本打成乱码。
images = "content"    # 正文配图：off | content（跳过商店/推广图）| all
max_images = 2        # 最多打印几张配图
max_image_height = 200  # 位图最大高度（dots，越小越省纸）
chinese = true        # 打印中文释义（不支持中文的机型设 false，会同时关掉译文）
vocab = true          # 是否附生词表

# 翻译提供方（按顺序尝试，失败自动换下一个）
[translation]
target = "zh-CN"
providers = ["mymemory", "google"]
email = ""            # MyMemory 额度：匿名 5000 字符/天，填邮箱可到 50000

# 封面图（从外部图源取一张；同一天内稳定，换天换图）
[cover]
source = "wikimedia"      # wikimedia（主题图）| picsum（随机美图）| local（本地图）| none
keywords = ["marcus aurelius bust", "seneca statue", "epictetus", "stoicism"]
# local_path = "/Users/you/Pictures/cover.jpg"   # source = "local" 时使用
width = 576
height = 320
credit = true             # 打印作者/许可/来源（wikimedia 的图建议保留）

[printer]
kind = "network"  # network（网口，推荐）| cups
ip = "192.168.1.50"   # 建议在路由器上按 MAC 绑定静态 IP，否则 IP 一变定时任务会静默失败
port = 9100            # 绝大多数 ESC/POS 网口打印机是 9100
# queue = "XP-80T"  # kind = "cups" 时填队列名（USB 打印机）

# 语音：每天打印时把文章正文（英文）合成语音发到 Telegram
[audio]
enabled = true                   # print 时是否生成/发送语音
engine = "auto"                  # auto | edge | say；auto 优先 edge-tts，失败降级 say
voice = "en-US-AriaNeural"       # edge-tts 神经音色（常见：en-US-JennyNeural / en-US-GuyNeural / en-GB-RyanNeural）
rate = "-10%"                    # edge-tts 语速；"0%" 原速，负值更慢
say_voice = "Samantha"           # 降级用 macOS say 音色
say_rate = 160                   # 降级用 say 语速（词/分）；默认 175 偏快
include_translation = false      # 是否把中文译文也读出来
max_words = 0                    # 限制朗读词数（0 = 全文）
send = true                      # 是否通过 openclaw 发送
channel = "telegram"
target = "1419937886"
# send_dir = "/Users/you/.openclaw/workspace/.openclaw/tmp/dailyprint-audio"  # 发送用目录；空 = 默认允许目录
# archive_dir = "/Users/you/Music/dailyprint"                              # 留档目录；空 = prints/audio

# 断更提醒：最新文章日期比今天老超过 stale_days 天时，经 openclaw 发一条 Telegram
# （每个自然日最多一条；发送失败只记日志，绝不影响打印）。同一篇文章不会重复打印，
# 见 `dailyprint print --force`。
# [notify]
# enabled = true
# stale_days = 2    # 最新文章超过几天没更新视为断更
# channel = ""      # 空 = 复用 [audio] 的 channel
# target = ""       # 空 = 复用 [audio] 的 target

# ---------------------------------------------------------------- 来源
# 每加一个来源就写一段 [sources.<名字>]，然后用 `dailyprint sources` 查看，
# 用 --source <名字> 或在 [defaults] 里切换默认来源。

[sources.daily-stoic]
type = "daily_stoic"
base_url = "https://dailystoic.com"

# RSS 是通用来源，任何提供 feed 的站点都能接：
# [sources.marginalian]
# type = "rss"
# url = "https://www.themarginalian.org/feed/"

