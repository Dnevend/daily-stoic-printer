# 复制为 config.toml 后按需修改（config.toml 不入库）
# 优先级：内置默认值 < config.toml < 环境变量 < 命令行参数

[defaults]
source = "daily-stoic"

[render]
width = 48        # 80mm Font A ≈ 48 列
words = 8         # 生词条数
common = 6000     # 前 N 个高频词视为"已认识"；调低＝生词更多更简单
max_words = 900   # 打印时正文最多保留多少词（0 = 不限）；长文会被截断但存档保留全文
filter_promos = true  # 过滤正文里的推广/CTA 段落（打印用；存档仍是原文）
promo_phrases = []    # 追加自定义促销短语，如 ["special offer", "limited time"]
translation = true    # 打印正文中文译文（需要联网，且打印机支持中文）
images = "content"    # 正文配图：off | content（跳过商店/推广图）| all
max_images = 2        # 最多打印几张配图
max_image_height = 400  # 位图最大高度（dots，越小越省纸）

# 翻译提供方（按顺序尝试，失败自动换下一个）
[translation]
target = "zh-CN"
providers = ["mymemory", "google"]
email = ""            # MyMemory 额度：匿名 5000 字符/天，填邮箱可到 50000

# 封面图（从外部图源取一张；同一天内稳定，换天换图）
[cover]
source = "wikimedia"      # wikimedia（主题图）| picsum（随机美图）| local（本地图）| none
keywords = ["marcus aurelius bust", "seneca statue", "epictetus", "stoicism"]
# local_path = "/Users/you/Pictures/cover.jpg"   # source = "local" 时使用
width = 576
height = 320
credit = true             # 打印作者/许可/来源（wikimedia 的图建议保留）
chinese = true    # 打印中文释义（不支持中文的机型设为 false）
vocab = true      # 是否附生词表

[printer]
kind = "network"  # network（网口，推荐）| cups
ip = "192.168.1.50"
port = 9100
# queue = "XP-80T"  # kind = "cups" 时填队列名（USB 打印机）

# ---------------------------------------------------------------- 来源
# 每加一个来源就写一段 [sources.<名字>]，然后用 `dailyprint sources` 查看，
# 用 --source <名字> 或在 [defaults] 里切换默认来源。

[sources.daily-stoic]
type = "daily_stoic"
base_url = "https://dailystoic.com"

# RSS 是通用来源，任何提供 feed 的站点都能接：
# [sources.marginalian]
# type = "rss"
# url = "https://www.themarginalian.org/feed/"

