[project]
name = "dailyprint"
version = "0.1.0"
description = "把每日英文文章排成 80mm 热敏小票打印，并附生词与中文释义（雅思备考向）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dnevend", email = "Dnevend@gmail.com" }]
keywords = ["thermal-printer", "escpos", "english-learning", "ielts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Printing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]
images = ["pillow>=10"]

[project.scripts]
dailyprint = "dailyprint.cli:main"

[project.urls]
Homepage = "https://github.com/Dnevend/daily-stoic-printer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailyprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
